<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geocodificador de Reclamos</title>
    <link rel="icon" href="img/ito.png" type="image/png">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; display: flex; height: 100vh; overflow: hidden; font-family: sans-serif; }
        .direccion-label {
            background-color: #ffeb3b; 
            color: #000;
            font-weight: bold;
            font-size: 11px;
            padding: 2px 4px;
            border: 1px solid #999;
            border-radius: 4px;
            white-space: nowrap;
            box-shadow: 1px 1px 2px rgba(0,0,0,0.3);
            position: absolute;
        }
        #panel-lateral { 
            width: 280px;
            background: #f4f4f4; 
            border-right: 1px solid #ccc; 
            z-index: 1000;
            padding: 10px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 8px; 
            overflow-y: auto;
        }
        #mapa { flex-grow: 1; background: #fff; }
        h3 { margin: 0 0 5px 0; color: #333; font-size: 18px; }
        .filtro-grupo { margin-bottom: 10px; } 
        .filtro-titulo { font-weight: bold; margin-bottom: 5px; color: #555; display: block; border-bottom: 1px solid #ccc; padding-bottom: 3px; font-size: 14px; }
        .contenedor-botones-col {
            display: flex;
            flex-direction: column;
            gap: 4px; 
        }
        .btn-servicio { 
            width: 100%;
            padding: 5px 2px;
            background-color: #007bff; 
            color: white; 
            border: none; 
            cursor: pointer; 
            font-size: 12px;
            border-radius: 4px;
            transition: background-color 0.2s;
            height: 40px; 
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            line-height: 1.1;
            word-wrap: break-word;
            white-space: normal;
            overflow: hidden;
        }
        .btn-servicio:hover { background-color: #0056b3; }
        .btn-servicio:active { background-color: #004494; }
    </style>
    <script src="https://unpkg.com/leaflet-image@0.0.4/leaflet-image.js"></script>
</head>
<body>
    <div id="panel-lateral">
        <h3>Procesar Reclamos</h3>
        <div style="margin-bottom: 1px;">
            <p id="estado-carga" onclick="recargarDatos()" 
                style="font-size: 12px; font-weight: bold; cursor: pointer; display: inline-block; padding: 5px 10px; border: 1px solid #ccc; border-radius: 4px; background: #f9f9f9; transition: all 0.3s ease;">
                    ESPERANDO DATOS...
            </p>
            <table style="display:block; font-size:10px; color:#666;">
                <tr>
                    <td>EXPORTACIÓN:</td>
                    <td id="fecha-edicion">--</td>
                </tr>
                <tr>
                    <td>SUBIDA:</td>
                    <td id="fecha-exportacion">--</td>
                </tr>
            </table>
        </div>
        <div id="contenedor-botones"></div>
        <div id="contenedor-filtros-reporte" style="margin-top: 2px; padding: 2px; border: 1px solid #ccc; border-radius: 5px; background-color: #f9f9f9;">
            <div style="font-weight: bold; margin-bottom: 2px;">Opciones de reporte:</div>
            <label style="display: block; margin-bottom: 2px;">
                <input type="checkbox" id="chkIncluirMapa" checked> Incluir mapa
            </label>
            <label style="display: block; margin-bottom: 2px;">
                <input type="checkbox" id="chkSinRutas"> Incluir puntos sin rutas
            </label>
            <label style="display: block;">
                <input type="checkbox" id="chkRutasVacias"> Incluir rutas sin puntos
            </label>
        </div>
    </div>
    <div id="mapa"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="CALLES.js"></script>
    <script src="RUTAS.js"></script>
    <script>
        let map;
        let markersLayer = L.layerGroup();
        let reclamosData = { type: "FeatureCollection", features: [] };
        const filtrosData = {
            "Turno Mañana": [
                { "Nombre": "Recolección Domiciliaria", "SERVICIO": "RDOM", "TURNO": "T3", "CLAVE": "RDOMTM" },
                { "Nombre": "Barrido Manual", "SERVICIO": "BMAN", "TURNO": "T1", "CLAVE": "BMANTM" },
                { "Nombre": "Almejas", "SERVICIO": "ALME", "TURNO": "T1", "CLAVE": "ALMETM" },
                { "Nombre": "Mantenimiento de Contenedores", "SERVICIO": "MACO", "TURNO": "T1", "CLAVE": "MACOTM" },
                { "Nombre": "Lavado de Contenedores", "SERVICIO": "LACO", "TURNO": "T1", "CLAVE": "LACOTM" },
                { "Nombre": "1000 horas", "SERVICIO": "1000", "TURNO": "T1", "CLAVE": "_1000TM" },
                { "Nombre": "Reposición de Cestos Papeleros", "SERVICIO": "RECE", "TURNO": "T1", "CLAVE": "RECETM" },
            ],
            "Turno Noche": [
                { "Nombre": "Recolección Domiciliaria - Rutas", "SERVICIO": "RDOM", "TURNO": "T3", "CLAVE": "RDOMTN" },
                { "Nombre": "Recolección Domiciliaria - Supervisores", "SERVICIO": "RDOM", "TURNO": "T3", "CLAVE": "SDOMTN" },
                { "Nombre": "Almeja", "SERVICIO": "ALME", "TURNO": "T1", "CLAVE": "ALMETN" },
                { "Nombre": "Mantenimiento de Contenedores", "SERVICIO": "MACO", "TURNO": "T3", "CLAVE": "MACOTN" },
                { "Nombre": "Lavado de Contenedores", "SERVICIO": "LACO", "TURNO": "T3", "CLAVE": "LACOTN" },
                { "Nombre": "Lavado de Calzadas o Veredas", "SERVICIO": "LAVA", "TURNO": "T3", "CLAVE": "LAVATN" },
                { "Nombre": "Lavado de Cestos Papeleros", "SERVICIO": "LACE", "TURNO": "T3", "CLAVE": "LACETN" },
            ]
        };
        
        window.onload = function() {
            map = L.map('mapa', { renderer: L.canvas() }).setView([-34.6395, -58.3871], 15);
            L.tileLayer('teselas/{z}/{x}/{y}.png', { minZoom: 7, maxZoom: 18 }).addTo(map);
            markersLayer.addTo(map);
            generarBotonesServicio();
            recargarDatos();
        };
        
        // 1sJKDOy6VGya8RNNz7cNLnheuq_x1yqIJ4nvnQMnTvio
        function recargarDatos() {
            const etiquetaEstado = document.getElementById("estado-carga");
            const idPlanilla = "1sJKDOy6VGya8RNNz7cNLnheuq_x1yqIJ4nvnQMnTvio";
            etiquetaEstado.innerText = "SINCRONIZANDO...";
            etiquetaEstado.style.color = "#d97706";
            etiquetaEstado.style.backgroundColor = "#fef3c7";
            etiquetaEstado.style.borderColor = "#f59e0b";
            const scripts = document.querySelectorAll('.google-script');
            scripts.forEach(s => s.remove());
            const urlHora = `https://docs.google.com/spreadsheets/d/${idPlanilla}/gviz/tq?tqx=responseHandler:procesarHora&sheet=Control&t=${new Date().getTime()}`;
            const scriptHora = document.createElement('script');
            scriptHora.className = 'google-script';
            scriptHora.src = urlHora;
            document.body.appendChild(scriptHora);
            const urlDatos = `https://docs.google.com/spreadsheets/d/${idPlanilla}/gviz/tq?tqx=responseHandler:procesarJSONP&sheet=Hoja1&t=${new Date().getTime()}`;
            const scriptDatos = document.createElement('script');
            scriptDatos.className = 'google-script';
            scriptDatos.src = urlDatos;
            document.body.appendChild(scriptDatos);
        }

        window.procesarHora = function(datos) {
            try {
                const filas = datos.table.rows;
                const formatearFechaGoogle = (celda) => {
                    if (!celda) return "Sin datos";
                    if (celda.f) return celda.f;
                    if (celda.v && celda.v.toString().includes("Date")) {
                        const match = celda.v.match(/\d+/g);
                        if (match) {
                            const d = match[2].padStart(2, '0');
                            const m = (parseInt(match[1]) + 1).toString().padStart(2, '0');
                            const a = match[0];
                            const h = match[3].padStart(2, '0');
                            const min = match[4].padStart(2, '0');
                            const seg = match[5].padStart(2, '0');
                            return `${d}/${m}/${a} ${h}:${min}:${seg}`;
                        }
                    }
                    return celda.v;
                };
                const edicion = formatearFechaGoogle(filas[0].c[1]);
                const exportacion = formatearFechaGoogle(filas[1].c[1]);
                document.getElementById("fecha-edicion").innerText = edicion;
                document.getElementById("fecha-exportacion").innerText = exportacion;
            } catch (e) {
                console.error("Error al formatear fechas:", e);
            }
        };
        
        window.procesarJSONP = function(datos) {
            const etiquetaEstado = document.getElementById("estado-carga");
            try {
                if (!datos || !datos.table || !datos.table.rows) {
                    throw new Error("Formato de datos no reconocido");
                }
                const filas = datos.table.rows;
                const features = filas.map((fila) => {
                    const v = fila.c;
                    const leer = (idx) => {
                        if (!v || !v[idx] || v[idx].v === null) return "";
                        return String(v[idx].v).trim();
                    };
                    const direccion = leer(3);
                    if (!direccion) return null;
                    return {
                        "type": "Feature",
                        "properties": {
                            "FECHA": v[0] ? (v[0].f || v[0].v) : "", 
                            "SERVICIO": leer(1),                     
                            "TURNO": leer(2),                        
                            "DIRECCION": direccion,                  
                            "SOLICITUD": leer(4),                    
                            "CODIGO": leer(5),                       
                            "AREA_ASIGNADA": "0" 
                        }
                    };
                }).filter(f => f !== null);
                reclamosData.features = features;
                if (etiquetaEstado) {
                    etiquetaEstado.innerText = reclamosData.features.length + " RECLAMOS CARGADOS (ACTUALIZAR)";
                    etiquetaEstado.style.color = "#15803d";
                    etiquetaEstado.style.backgroundColor = "#dcfce7";
                    etiquetaEstado.style.borderColor = "#22c55e";
                }
                console.log("Datos cargados: " + reclamosData.features.length);
            } catch (error) {
                console.error("Error en procesarJSONP:", error);
                if (etiquetaEstado) {
                    etiquetaEstado.innerText = "PROBLEMA AL CARGAR DATOS";
                    etiquetaEstado.style.color = "#b91c1c";
                    etiquetaEstado.style.backgroundColor = "#fee2e2";
                    etiquetaEstado.style.borderColor = "#ef4444";
                }
            }
        };

        function generarBotonesServicio() {
            const contenedorPrincipal = document.getElementById("contenedor-botones");
            contenedorPrincipal.innerHTML = "";
            for (const turno in filtrosData) {
                let grupoDiv = document.createElement("div");
                grupoDiv.className = "filtro-grupo";
                grupoDiv.innerHTML = `<span class="filtro-titulo">${turno}</span>`;
                let colDiv = document.createElement("div");
                colDiv.className = "contenedor-botones-col"; 
                filtrosData[turno].forEach(servicio => {
                    let btn = document.createElement("button");
                    btn.className = "btn-servicio";
                    btn.innerText = servicio.Nombre;
                    btn.onclick = function() {
                        generarReportePorServicio(servicio);
                    };
                    colDiv.appendChild(btn); 
                });
                grupoDiv.appendChild(colDiv); 
                contenedorPrincipal.appendChild(grupoDiv);
            }
        }
        
        function iniciarGeocodificacionPorServicio(servicioSeleccionado) {
            if (typeof callesData === 'undefined' || typeof reclamosData === 'undefined' || typeof rutasData === 'undefined') {
                alert("Error: Faltan cargar los archivos de datos (CALLES, RECLAMOS o RUTAS).");
                return;
            }
            
            markersLayer.clearLayers();
            const normalizar = (texto) => texto ? texto.toString().trim().toUpperCase() : "";

            console.log(`--- Iniciando geocodificación para: ${servicioSeleccionado.CLAVE} ---`);
            
            let encontrados = 0;
            let fallidos = 0;
            let erroresDetalle = []; // Para almacenar los fallos

            reclamosData.features.forEach((reclamo) => {
                const p = reclamo.properties;
                if (p.TURNO !== servicioSeleccionado.TURNO || p.SERVICIO !== servicioSeleccionado.SERVICIO) return;
                
                const direccionCompleta = p.DIRECCION;
                if (!direccionCompleta) {
                    erroresDetalle.push({ CODIGO: p.CODIGO, DIRECCION: "N/A", MOTIVO: "Dirección vacía" });
                    fallidos++;
                    return;
                }

                const partes = direccionCompleta.match(/(.*)\s(\d+)$/);
                if (!partes) {
                    erroresDetalle.push({ CODIGO: p.CODIGO, DIRECCION: direccionCompleta, MOTIVO: "Formato inválido (falta altura o nombre)" });
                    fallidos++;
                    return;
                }

                const calleBuscada = normalizar(partes[1]);
                const numeroBuscado = parseInt(partes[2]);

                const segmentoCalle = callesData.features.find(f => {
                    if (!f.properties.Street) return false;
                    const calleEnCalle = normalizar(f.properties.Street);
                    if (calleEnCalle !== calleBuscada) return false;
                    const pCalle = f.properties;
                    return (numeroBuscado >= pCalle.Fromleft && numeroBuscado <= pCalle.Toleft) || 
                        (numeroBuscado >= pCalle.Fromright && numeroBuscado <= pCalle.Toright);
                });

                if (segmentoCalle) {
                    const pCalle = segmentoCalle.properties;
                    let desde = Math.min(pCalle.Fromleft, pCalle.Fromright);
                    let hasta = Math.max(pCalle.Toleft, pCalle.Toright);
                    let porcentaje = (hasta - desde !== 0) ? (numeroBuscado - desde) / (hasta - desde) : 0.5;
                    porcentaje = Math.max(0, Math.min(1, porcentaje));
                    
                    const coords = segmentoCalle.geometry.coordinates[0];
                    const latlng = calcularPuntoEnLineaPorDistancia(coords, porcentaje);
                    
                    let areaEncontrada = "0";
                    let idSegmento = String(pCalle.Id); 
                    let featureRuta = rutasData.features.find(f => String(f.properties.Id) === idSegmento);
                    
                    if (featureRuta) {
                        areaEncontrada = featureRuta.properties[servicioSeleccionado.CLAVE] || "0";
                    }
                    
                    p.AREA_ASIGNADA = areaEncontrada;

                    // Marcador en el mapa
                    L.circleMarker(latlng, {
                        radius: 7, fillColor: "#ff0000", color: "#000", weight: 1, opacity: 1, fillOpacity: 0.8
                    }).addTo(markersLayer).bindPopup(`<b>${p.CODIGO}</b><br>${direccionCompleta}<br>ID: ${idSegmento}<br>Ruta: ${p.AREA_ASIGNADA}`);

                    let labelIcon = L.divIcon({
                        className: 'direccion-label', html: direccionCompleta, iconSize: null, iconAnchor: [50, 30]
                    });
                    L.marker(latlng, { icon: labelIcon }).addTo(markersLayer);
                    
                    encontrados++;
                } else {
                    // REGISTRO DE FALLO: No se encontró la calle o la altura
                    erroresDetalle.push({ 
                        CODIGO: p.CODIGO, 
                        DIRECCION: direccionCompleta, 
                        MOTIVO: "Calle no encontrada o altura fuera de rango" 
                    });
                    fallidos++;
                }
            });

            // --- REPORTE FINAL POR CONSOLA ---
            console.log(`--- Proceso finalizado. Ubicados: ${encontrados}, Fallidos: ${fallidos} ---`);
            
            if (erroresDetalle.length > 0) {
                console.group("Detalle de Reclamos NO Geocodificados");
                console.table(erroresDetalle); // Crea una tabla interactiva en la consola
                console.groupEnd();
            }
        }
        
        function generarReportePorServicio(servicioSeleccionado) {
            if (typeof reclamosData === 'undefined' || typeof rutasData === 'undefined' || typeof callesData === 'undefined') {
                alert("Error: Faltan cargar los archivos de datos.");
                return;
            }

            const incluirMapa = document.getElementById('chkIncluirMapa').checked;
            const incluirSinRutas = document.getElementById('chkSinRutas').checked;
            const incluirRutasVacias = document.getElementById('chkRutasVacias').checked;
            const normalizar = (t) => t ? t.toString().trim().toUpperCase() : "";

            const rutasAgrupadas = {};
            const geoJSONPorRuta = {};

            // --- 1. PROCESAMIENTO DE DATOS ---
            reclamosData.features.forEach(reclamo => {
                const p = reclamo.properties;
                if (p.TURNO !== servicioSeleccionado.TURNO || p.SERVICIO !== servicioSeleccionado.SERVICIO) return;
                
                const direccionCompleta = p.DIRECCION;
                const partes = direccionCompleta ? direccionCompleta.match(/(.*)\s(\d+)$/) : null;
                let rutaEncontrada = "Sin Ruta";
                let latlng = null;

                if (partes) {
                    const calleBuscada = normalizar(partes[1]);
                    const numeroBuscado = parseInt(partes[2]);
                    const segmento = callesData.features.find(f => {
                        if (!f.properties.Street) return false;
                        return normalizar(f.properties.Street) === calleBuscada &&
                            ((numeroBuscado >= f.properties.Fromleft && numeroBuscado <= f.properties.Toleft) || 
                                (numeroBuscado >= f.properties.Fromright && numeroBuscado <= f.properties.Toright));
                    });

                    if (segmento) {
                        let idSegmento = String(segmento.properties.Id);
                        let featureRuta = rutasData.features.find(f => String(f.properties.Id) === idSegmento);
                        if (featureRuta) rutaEncontrada = featureRuta.properties[servicioSeleccionado.CLAVE] || "Sin Ruta";
                        
                        const coords = segmento.geometry.coordinates[0];
                        latlng = calcularPuntoEnLineaPorDistancia(coords, 0.5);
                    }
                }

                if (rutaEncontrada === "" || rutaEncontrada === "0") rutaEncontrada = "Sin Ruta";
                if (rutaEncontrada === "Sin Ruta" && !incluirSinRutas) return;

                if (!rutasAgrupadas[rutaEncontrada]) {
                    rutasAgrupadas[rutaEncontrada] = [];
                    geoJSONPorRuta[rutaEncontrada] = [];
                }
                rutasAgrupadas[rutaEncontrada].push(p);
                if (latlng) geoJSONPorRuta[rutaEncontrada].push({
                    type: "Feature", geometry: { type: "Point", coordinates: [latlng.lng, latlng.lat] },
                    properties: { direccion: p.DIRECCION }
                });
            });

            if (incluirRutasVacias) {
                rutasData.features.forEach(f => {
                    let nombre = f.properties[servicioSeleccionado.CLAVE];
                    if (nombre && nombre !== "0" && !rutasAgrupadas[nombre]) {
                        rutasAgrupadas[nombre] = []; geoJSONPorRuta[nombre] = [];
                    }
                });
            }

            // --- 2. CONSTRUCCIÓN DEL HTML ---
            let contenidoReportes = "";
            let mapaScripts = "";

            for (const ruta in rutasAgrupadas) {
                const reclamosRuta = rutasAgrupadas[ruta];
                const totalGeneral = reclamosRuta.length;
                let numHoja = 1;
                let totalHojas = 1;

            if (incluirMapa) {
                        if (totalGeneral <= 27) {
                            totalHojas = 1;
                        } else {
                            const resto = totalGeneral % 69;
                            // Si sobran más de 27 después de las hojas de 69, se necesita una hoja extra de mapa gigante
                            totalHojas = Math.floor(totalGeneral / 69) + (resto > 27 || resto === 0 ? 2 : 1);
                        }
                    } else {
                        totalHojas = Math.ceil(totalGeneral / 26) || 1;
                    }

                    let offset = 0;
                    const nombreLimpioRuta = ruta.replace(/[^a-zA-Z0-9]/g, "_");

                    if (incluirMapa) {
                        if (totalGeneral <= 27) {
                            contenidoReportes += generarHojaHTML(ruta, reclamosRuta, true, servicioSeleccionado, "A3", false, 1, 1, totalGeneral);
                            mapaScripts += crearScriptMapa(`mapa_${nombreLimpioRuta}_h1`, geoJSONPorRuta[ruta]);
                        } else {
                            while (offset < totalGeneral) {
                                let restantes = totalGeneral - offset;
                                if (restantes > 27) {
                                    contenidoReportes += generarHojaHTML(ruta, reclamosRuta.slice(offset, offset + 69), false, servicioSeleccionado, "A3", false, numHoja, totalHojas, totalGeneral);
                                    offset += 69;
                                    numHoja++;
                                } else {
                                    // Última hoja con datos y mapa
                                    contenidoReportes += generarHojaHTML(ruta, reclamosRuta.slice(offset), true, servicioSeleccionado, "A3", false, numHoja, totalHojas, totalGeneral);
                                    mapaScripts += crearScriptMapa(`mapa_${nombreLimpioRuta}_h${numHoja}`, geoJSONPorRuta[ruta]);
                                    offset = totalGeneral;
                                    numHoja++;
                                }
                            }
                            // Hoja extra de mapa gigante si el excedente fue mucho
                            if (totalGeneral % 69 > 27 || totalGeneral % 69 === 0) {
                                contenidoReportes += generarHojaHTML(ruta, [], true, servicioSeleccionado, "A3", true, numHoja, totalHojas, totalGeneral);
                                mapaScripts += crearScriptMapa(`mapa_${nombreLimpioRuta}_h${numHoja}`, geoJSONPorRuta[ruta]);
                            }
                        }
                    } else {
                    // --- Lógica A4 Horizontal ---
                    if (totalGeneral === 0) {
                        contenidoReportes += generarHojaHTML(ruta, [], false, servicioSeleccionado, "A4", false, 1, 1, 0);
                    } else {
                        while (offset < totalGeneral) {
                            contenidoReportes += generarHojaHTML(ruta, reclamosRuta.slice(offset, offset + 26), false, servicioSeleccionado, "A4", false, numHoja, totalHojas, totalGeneral);
                            offset += 26;
                            numHoja++;
                        }
                    }
                }
            }

            // Función auxiliar para generar el JS de cada mapa
            function crearScriptMapa(id, puntos) {
                return `
                    (function(){
                        var m = L.map('${id}', {zoomControl:false, attributionControl:false, dragging:false, scrollWheelZoom:false}).setView([-34.6395, -58.3871], 14);
                        L.tileLayer('teselas/{z}/{x}/{y}.png').addTo(m);
                        var pts = ${JSON.stringify(puntos)};
                        if(pts.length > 0){
                            var lyr = L.geoJSON(pts, {
                                pointToLayer: (f, l) => L.circleMarker(l, {radius:6, fillColor:'red', color:'black', weight:1, fillOpacity:0.8}),
                                onEachFeature: (f, layer) => layer.bindTooltip(f.properties.direccion, {permanent:true, direction:'top', className:'etiqueta-mapa'})
                            }).addTo(m);
                            m.fitBounds(lyr.getBounds().pad(0.2));
                        }
                    })();`;
            }

            abrirVentanaReporte(contenidoReportes, mapaScripts, incluirMapa);
        }

        function generarHojaHTML(ruta, datos, conMapa, serv, tipoPapel, mapaGigante, hojaActual, totalHojas, totalGeneral) {
            let filas = datos.map(p => `
                <tr>
                    <td class="col-reclamo">${p.CODIGO}</td>
                    <td class="col-fecha">${p.FECHA || ''}</td>
                    <td class="col-direccion">${p.DIRECCION}</td>
                    <td class="col-solicitud">${p.SOLICITUD || ''}</td>
                    <td class="col-resolucion"></td><td class="col-codigo"></td><td class="col-obs"></td>
                </tr>`).join('');

            if (datos.length === 0 && !mapaGigante) {
                filas = "<tr><td colspan='7' style='text-align:center;'>Sin reclamos en esta ruta</td></tr>";

            const mapaId = `mapa_${ruta.replace(/[^a-zA-Z0-9]/g, "_")}_h${hojaActual}`;
            const mapaDiv = conMapa ? `<div id="${mapaId}" class="${mapaGigante ? 'mapa-gigante' : 'mapa-normal'}"></div>` : "";
            
            // Si hay más de una hoja, muestra la numeración, de lo contrario solo el conteo
            const textoConteo = `${totalGeneral}${totalHojas > 1 ? ` (Hoja ${hojaActual} de ${totalHojas})` : ''}`;

            return `
            <div class="hoja-reporte ${tipoPapel}">

                        <td style="width: 15%">Servicio:</td>
                        <td style="width: 60%">${serv.Nombre}</td>

                    </tr>
                    <tr>
                        <td>Ruta:</td>
                        <td>${ruta}</td>
                        <td style="width: 10%">FECHA:</td>
                        <td>${new Date().toLocaleString('es-AR', { hour12: false })}</td>
                    </tr>
                    <tr>
                        <td>Turno:</td>
                        <td>${serv.TURNO || ''}</td>
                        <td>SUPERVISOR:</td>
                        <td>__________________</td>
                    </tr>
                    <tr>
                        <td>Rec. / Sol. :</td>
                        <td>${textoConteo}</td>
                        <td>FIRMA:</td>
                        <td>__________________</td>
                    </tr>
                </table>

                ${!mapaGigante ? `
                <div class="contenedor-tabla">
                    <table class="tabla-datos">
                        <thead>
                            <tr>
                                <th class="col-reclamo">Reclamo</th>
                                <th class="col-fecha">Fecha</th>
                                <th class="col-direccion">Dirección</th>
                                <th class="col-solicitud">Solicitud</th>
                                <th class="col-hora">Hora</th>
                                <th class="col-cod">Cód</th>
                                <th class="col-obs">Obs</th>
                            </tr>
                        </thead>
                        <tbody>${filas}</tbody>
                    </table>
                </div>` : ""}

                <div class="espaciador-flexible"></div>

                <div class="leyenda-referencias">
                    REFERENCIAS DE RESOLUCIÓN: 02 - DIRECCIÓN INEXISTENTE / 04 - NADA EN EL LUGAR / 06 - NO OPERABLE / 08 - NO CORRESPONDE / 10 - CUMPLIDO
                </div>
                
                ${mapaDiv}
            </div>`;
        }

        function calcularPuntoEnLineaPorDistancia(coords, porcentaje) {
            if (coords.length < 2) return {lat: coords[0][1], lng: coords[0][0]};
            let porcentajeAjustado = 0.2 + (porcentaje * 0.6); 
            let distancias = [];
            let distanciaTotal = 0;
            for (let i = 0; i < coords.length - 1; i++) {
                let d = Math.sqrt(Math.pow(coords[i+1][0] - coords[i][0], 2) + Math.pow(coords[i+1][1] - coords[i][1], 2));
                distancias.push(d);
                distanciaTotal += d;
            }
            let distanciaObjetivo = porcentajeAjustado * distanciaTotal;
            let distanciaAcumulada = 0;
            for (let i = 0; i < distancias.length; i++) {
                if (distanciaAcumulada + distancias[i] >= distanciaObjetivo) {
                    let porcentajeSegmento = (distanciaObjetivo - distanciaAcumulada) / distancias[i];
                    let lat = coords[i][1] + (coords[i+1][1] - coords[i][1]) * porcentajeSegmento;
                    let lng = coords[i][0] + (coords[i+1][0] - coords[i][0]) * porcentajeSegmento;
                    return {lat: lat, lng: lng};
                }
                distanciaAcumulada += distancias[i];
            }
            return {lat: coords[coords.length-1][1], lng: coords[coords.length-1][0]};
        }
    </script>
